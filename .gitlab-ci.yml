stages:
  - build
  - release

build:
  stage: build
  image: node:latest
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - main.js
      - manifest.json
      - styles.css
  only:
    - master

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release..."
    - |
      VERSION=$(grep '"version":' manifest.json | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
      echo "VERSION=$VERSION" >> build.env
      echo "Detected Version: $VERSION"
  artifacts:
    reports:
      dotenv: build.env
  release:
    name: "Release $VERSION"
    description: "Automatic release for version $VERSION"
    tag_name: "$VERSION"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "main.js"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/main.js"
        - name: "manifest.json"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/manifest.json"
        - name: "styles.css"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/styles.css"
  needs:
    - job: build
      artifacts: true
  only:
    - master
